<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGP Shortlink — Tonton & Lanjutkan</title>

<!-- 1️⃣ SDK Telegram WebApp -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- 2️⃣ SDK IKLAN KAMU — SESUAI KODE YANG KASIH -->
<script src='//libtl.com/sdk.js' data-zone='11003507' data-sdk='show_11003507'></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}
body {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.kotak {
  background: white;
  border-radius: 20px;
  padding: 40px 30px;
  max-width: 400px;
  width: 100%;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}
h2 {
  color: #1a1a2e;
  margin-bottom: 15px;
  font-size: 22px;
}
p {
  color: #666;
  margin-bottom: 25px;
  line-height: 1.6;
}
.tombol {
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: white;
  border: none;
  padding: 15px 30px;
  font-size: 18px;
  font-weight: bold;
  border-radius: 12px;
  width: 100%;
  cursor: pointer;
  transition: 0.3s;
}
.tombol:disabled {
  background: #ccc;
  cursor: not-allowed;
}
.sembunyi {
  display: none !important;
}
.info {
  margin-top: 25px;
  font-size: 12px;
  color: #aaa;
}
</style>
</head>
<body>

<div class="kotak">
  <h2>🎬 Tonton Iklan & Lanjutkan</h2>
  <p>Tonton iklan sampai selesai untuk membuka link tujuan</p>

  <!-- Langkah 1: Tombol Mulai -->
  <div id="langkahMulai">
    <button class="tombol" onclick="mulaiIklan()">▶️ Mulai Tonton Iklan</button>
  </div>

  <!-- Langkah 2: Sedang Berjalan -->
  <div id="langkahProses" class="sembunyi">
    <h2>⏳ Sedang Memproses...</h2>
    <p>Tunggu iklan selesai ditonton & klik Claim</p>
    <button class="tombol" disabled>Mohon Tunggu...</button>
  </div>

  <!-- Langkah 3: Selesai & Lanjut -->
  <div id="langkahSelesai" class="sembunyi">
    <h2>✅ Berhasil!</h2>
    <p>Sedang dialihkan ke tujuan...</p>
  </div>

  <div class="info">Powered by AGP Shortlink</div>
</div>

<script>
// Inisialisasi Telegram Mini App
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// ==============================================
// ✅ GANTI LINK TUJUAN DISINI!
// ==============================================
const LINK_TUJUAN = "https://link-tujuan-kamu-disini.com";

function mulaiIklan() {
  // Ganti tampilan
  document.getElementById('langkahMulai').classList.add('sembunyi');
  document.getElementById('langkahProses').classList.remove('sembunyi');

  // === FUNGSI IKLAN KAMU LANGSUNG DIPAKAI ===
  show_11003507()
    .then(() => {
      // ✅ Selesai ditonton & diklaim
      document.getElementById('langkahProses').classList.add('sembunyi');
      document.getElementById('langkahSelesai').classList.remove('sembunyi');
      
      setTimeout(() => {
        window.location.href = LINK_TUJUAN;
      }, 1500);
    })
    .catch((error) => {
      // ❌ Dilewati / gagal
      alert("Harap tonton sampai selesai & klik Claim!");
      
      // Kembalikan ke tampilan awal
      document.getElementById('langkahProses').classList.add('sembunyi');
      document.getElementById('langkahMulai').classList.remove('sembunyi');
    });
}
</script>

</body>
</html>
