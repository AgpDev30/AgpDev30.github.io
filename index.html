<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Teka Teki Cuan</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src='//libtl.com/sdk.js' data-zone='11003507' data-sdk='show_11003507'></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #673AB7, #9C27B0);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #ffffff;
    }
    .kotak {
      background: rgba(0, 0, 0, 0.25);
      padding: 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .saldo-box {
      background: #7B61FF;
      padding: 12px 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      font-size: 22px;
      font-weight: bold;
      color: #FFD700;
      border: 3px solid #FFD700;
      display: inline-block;
      width: 100%;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .soal {
      font-size: 18px;
      margin-bottom: 25px;
      line-height: 1.6;
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 10px;
    }
    .jawaban {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 20px;
      background: #ffffff;
      color: #333;
    }
    .btn {
      background: #ffffff;
      color: #673AB7;
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      margin: 8px 0;
      cursor: pointer;
      width: 100%;
      transition: 0.3s;
    }
    .btn:hover { transform: scale(1.02); }
    .btn2 { background: #FFC107; color: #222; font-size: 17px; padding: 16px; }
    .btn-tarik { background: #4CAF50; color: #fff; font-size: 17px; padding: 16px; }
    .hasil { font-weight: bold; font-size: 17px; margin: 10px 0; min-height: 25px; }
    .peringatan { color: #FF4444; font-weight: bold; margin-top: 8px; padding: 8px; background: rgba(255,68,68,0.1); border-radius: 6px; }
    .pesan-sukses { color: #00FF7F; font-weight: bold; margin-top: 8px; padding: 8px; background: rgba(0,255,127,0.1); border-radius: 6px; }
    .sembunyi { display: none; }
    .dialog-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .dialog-box {
      background: #fff;
      color: #333;
      padding: 25px;
      border-radius: 15px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }
    .dialog-box h3 { margin-bottom: 15px; color: #673AB7; }
    .pilihan-metod { display: flex; gap: 10px; margin-bottom: 15px; }
    .btn-metod { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-dana { background: #00C2E8; color: white; }
    .btn-paypal { background: #0070BA; color: white; }
    .form-input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    .btn-kirim { background: #4CAF50; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; margin-top: 10px; width: 100%; cursor: pointer; }
    .btn-tutup { background: #ccc; color: #333; border: none; padding: 8px 15px; border-radius: 6px; margin-top: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="kotak">
    <div class="saldo-box">💰 Saldo: $<span id="saldoUser">0.00</span></div>
    <h1>🧩 TEKA TEKI CUAN</h1>
    <div id="bagianSoal">
      <p class="soal" id="teksSoal"></p>
      <input class="jawaban" id="inputJawab" placeholder="Ketik jawaban disini" type="text" />
      <br>
      <button class="btn" onclick="cekJawaban()">✅ Cek Jawaban</button>
      <br><br>
      <button class="btn sembunyi" id="tombolLanjut" onclick="soalBerikutnya()">⏭️ Soal Berikutnya</button>
    </div>
    <div class="hasil" id="hasilTeks"></div>
    <div id="pesanInfo"></div>
    <br><br>
    <button class="btn btn2" onclick="tampilkanIklan()">📺 Tonton Iklan Dan Dukung Kami</button>
    <br>
    <button class="btn btn-tarik" onclick="tarikSaldo()">💸 Withdraw Saldo</button>
  </div>

  <div id="dialogPenarikan" class="dialog-overlay sembunyi">
    <div class="dialog-box">
      <h3>Formulir Penarikan</h3>
      <p>Pilih Metode Pembayaran:</p>
      <div class="pilihan-metod">
        <button class="btn-metod btn-dana" onclick="pilihMetode('dana')">DANA</button>
        <button class="btn-metod btn-paypal" onclick="pilihMetode('paypal')">PAYPAL</button>
      </div>
      <div id="formDana" class="sembunyi">
        <input type="text" class="form-input" id="nomorDana" placeholder="Masukkan Nomor DANA">
        <input type="text" class="form-input" id="namaDana" placeholder="Masukkan Nama Lengkap">
      </div>
      <div id="formPaypal" class="sembunyi">
        <input type="email" class="form-input" id="emailPaypal" placeholder="Masukkan Email PayPal">
        <input type="text" class="form-input" id="namaPaypal" placeholder="Masukkan Nama Lengkap">
      </div>
      <button class="btn-kirim sembunyi" id="btnKirim" onclick="kirimPenarikan()">SEND</button>
      <br>
      <button class="btn-tutup" onclick="tutupDialog()">Tutup</button>
    </div>
  </div>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    if (tg.initDataUnsafe) {
      tg.openLink("https://agpdev30.github.io/index.html");
    }

    let saldo = parseFloat(localStorage.getItem("saldoTekaTeki")) || 0.00;
    updateSaldoTampilan();

    const daftarSoal = [
      {soal: "Semakin banyak kamu ambil, semakin besar ukurannya. Apakah itu?", jawaban: "lubang"},
      {soal: "Benda apa yang kalau dipotong malah jadi semakin panjang?", jawaban: "jembatan"},
      {soal: "Punya mata tapi tidak bisa melihat, punya kaki tapi tidak bisa berjalan. Apakah itu?", jawaban: "meja"},
      {soal: "Apa yang naik tapi tidak pernah turun?", jawaban: "umur"},
      {soal: "Benda apa yang kalau basah, beratnya jadi lebih ringan?", jawaban: "kapas"},
      {soal: "Benda apa yang punya leher tapi tidak punya kepala?", jawaban: "baju"},
      {soal: "Semakin kamu isi, semakin ringan benda apa itu?", jawaban: "balon"},
      {soal: "Benda apa yang punya gigi tapi tidak bisa makan?", jawaban: "sisir"},
      {soal: "Benda apa yang punya banyak gigi tapi tidak pernah mengunyah?", jawaban: "ritsleting"},
      {soal: "Apa yang kalau dipakai, malah makin pendek?", jawaban: "lilin"},
      {soal: "Benda apa yang punya kaki empat tapi tidak bisa berjalan?", jawaban: "meja"},
      {soal: "Benda apa yang punya leher panjang tapi tidak punya kepala?", jawaban: "jerapah"},
      {soal: "Apa yang ada di ujung langit dan di ujung bumi?", jawaban: "huruf i"},
      {soal: "Benda apa yang kalau dibalik berubah jadi hal lain?", jawaban: "jam pasir"},
      {soal: "Apa yang makin dipotong makin tinggi?", jawaban: "celana panjang"},
      {soal: "Benda apa yang punya mulut tapi tidak bisa bicara?", jawaban: "pintu"},
      {soal: "Benda apa yang punya banyak daun tapi bukan pohon?", jawaban: "buku"},
      {soal: "Apa yang kalau kering malah jadi basah?", jawaban: "kapas mandi"},
      {soal: "Benda apa yang bisa jalan tapi tidak punya kaki?", jawaban: "air"},
      {soal: "Benda apa yang kalau diikat dia pergi, kalau dilepas dia diam?", jawaban: "sepatu"},
      {soal: "Apa yang penuh lubang tapi tetap bisa menampung air?", jawaban: "spons"},
      {soal: "Benda apa yang punya lidah tapi tidak punya mulut?", jawaban: "sepatu"},
      {soal: "Benda apa yang kalau dijemur malah jadi berat?", jawaban: "es batu"},
      {soal: "Apa yang lebih besar kalau diambil dari bagian tengah?", jawaban: "lubang"},
      {soal: "Benda apa yang selalu datang tapi tidak pernah sampai?", jawaban: "besok"}
    ];

    let nomorSekarang = 0;
    let metodeTerpilih = "";

    function updateSaldoTampilan(){
      document.getElementById("saldoUser").textContent = saldo.toFixed(2);
      localStorage.setItem("saldoTekaTeki", saldo.toFixed(2));
    }

    function tampilkanSoal(){
      document.getElementById("teksSoal").textContent = daftarSoal[nomorSekarang].soal;
      document.getElementById("inputJawab").value = "";
      document.getElementById("hasilTeks").textContent = "";
      document.getElementById("pesanInfo").innerHTML = "";
      document.getElementById("tombolLanjut").classList.add("sembunyi");
    }
        function cekJawaban(){
      const jawabUser = document.getElementById("inputJawab").value.trim().toLowerCase();
      const jawabBenar = daftarSoal[nomorSekarang].jawaban.toLowerCase();
      
      if(jawabUser === jawabBenar){
        document.getElementById("hasilTeks").textContent = "✅ BENAR! + $0.40 Ditambahkan";
        document.getElementById("hasilTeks").style.color = "#81FF81";
        saldo += 0.40;
        updateSaldoTampilan();
        document.getElementById("pesanInfo").innerHTML = "<div class='pesan-sukses'>+ $0.40 Berhasil!</div>";
        soalBerikutnyaOtomatis();
        if(typeof show_11003507 !== 'undefined') { show_11003507('reward'); }
      }else{
        document.getElementById("hasilTeks").textContent = "❌ Salah, coba lagi ya!";
        document.getElementById("hasilTeks").style.color = "#FF9E9E";
      }
    }

    function soalBerikutnyaOtomatis(){
      nomorSekarang = (nomorSekarang + 1) % daftarSoal.length;
      tampilkanSoal();
    }

    function soalBerikutnya(){
      nomorSekarang = (nomorSekarang + 1) % daftarSoal.length;
      tampilkanSoal();
    }

    function tampilkanIklan(){
      if(typeof show_11003507 !== 'undefined'){
        show_11003507('reward').then(function(){ 
          saldo += 0.02; 
          updateSaldoTampilan();
          document.getElementById("pesanInfo").innerHTML = "<div class='pesan-sukses'>+ $0.02 Terima Kasih!</div>";
        });
      } else { alert("⚠️ Iklan sedang dimuat, coba lagi!"); }
    }

    function tarikSaldo(){
      document.getElementById("pesanInfo").innerHTML = "";
      if(saldo >= 10.00){
        document.getElementById("dialogPenarikan").classList.remove("sembunyi");
      } else {
        document.getElementById("pesanInfo").innerHTML = "<div class='peringatan'>❌ Saldo Tidak Cukup! Minimal Penarikan $10.00</div>";
      }
    }
        function pilihMetode(metode){
      metodeTerpilih = metode;
      document.getElementById("formDana").classList.add("sembunyi");
      document.getElementById("formPaypal").classList.add("sembunyi");
      if(metode === 'dana') document.getElementById("formDana").classList.remove("sembunyi");
      if(metode === 'paypal') document.getElementById("formPaypal").classList.remove("sembunyi");
      document.getElementById("btnKirim").classList.remove("sembunyi");
    }

    function kirimPenarikan(){
      tutupDialog();
      document.getElementById("pesanInfo").innerHTML = "<div class='pesan-sukses'>✅ Team Sedang Riview Penghasilan anda</div>";
    }

    function tutupDialog(){
      document.getElementById("dialogPenarikan").classList.add("sembunyi");
      document.getElementById("nomorDana").value = "";
      document.getElementById("namaDana").value = "";
      document.getElementById("emailPaypal").value = "";
      document.getElementById("namaPaypal").value = "";
      document.getElementById("formDana").classList.add("sembunyi");
      document.getElementById("formPaypal").classList.add("sembunyi");
      document.getElementById("btnKirim").classList.add("sembunyi");
      metodeTerpilih = "";
    }

    tampilkanSoal();
  </script>

</body>
</html>
